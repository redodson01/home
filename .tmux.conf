set-environment -gu GIT_DIR
set-environment -gu GIT_EXEC_PATH
set-environment -gu GIT_WORK_TREE

set-option -g @bg "#{?#{==:#(mode),dark},black,brightwhite}"
set-option -g @fg "#{?pane_modal_flag,blue,#{?pane_marked,magenta,#{?synchronize-panes,red,#{?pane_in_mode,yellow,brightred}}}}"
set-option -g focus-events on
set-option -g message-command-style "bg=green,fg=#{E:@bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=green}"
set-option -g message-style "bg=yellow,fg=#{E:@bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=yellow}"
set-option -g mode-keys vi
set-option -g pane-active-border-style "bg=#{E:@fg},fg=#{E:@fg}"
set-option -g pane-border-style default
set-option -g session-status-current-style "#{E:session-status-style},bold,underscore"
set-option -g session-status-style "fg=#{?#{m:*!*,#{W:#{@window_state}}},red,#{m:*…*,#{W:#{@window_state}}},yellow,#{m:*✓*,#{W:#{@window_state}}},green,terminal}"
set-option -g status 2
set-option -g status-format[0] "#[align=left]#{R: ,#{e|-:#{w;T;=/#{status-left-length}:status-left},3}}S: #[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S:#[range=session|#{session_id} #{E:session-status-style}]#[push-default]#S#{W:#{@window_state}}#{q/h:session_alert}#[pop-default]#[norange list=on default]  ,#[range=session|#{session_id} list=focus #{?#{!=:#{E:session-status-current-style},default},#{E:session-status-current-style},#{E:session-status-style}}]#[push-default]#S*#{W:#{@window_state}}#{q/h:session_alert}#[pop-default]#[norange list=on default] }"
set-option -g status-format[1] "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set-option -g status-keys vi
set-option -g status-style "bg=#{E:@bg},fg=terminal"
set-option -g window-status-current-format "#{E:window-status-format}"
set-option -g window-status-current-style "#{E:window-status-style},bold,underscore"
set-option -g window-status-format "#I:#W#F#{@window_state}"
set-option -g window-status-style "fg=#{?#{==:#{@window_state},!},red,#{==:#{@window_state},…},yellow,#{==:#{@window_state},✓},green,terminal}"

bind-key            (     switch-client -p -O creation
bind-key            )     switch-client -n -O creation
bind-key            _     split-window -d
bind-key            |     split-window -d -h
bind-key          C-h     move-pane -b -d -h
bind-key          C-j     move-pane -d      
bind-key          C-k     move-pane -b -d      
bind-key          C-l     move-pane -d -h
bind-key          C-s     swap-pane
bind-key        C-S-h     move-pane -b -d -f -h
bind-key        C-S-j     move-pane -d -f   
bind-key        C-S-k     move-pane -b -d -f   
bind-key        C-S-l     move-pane -d -f -h
bind-key   -n     M-(     switch-client -p -O creation
bind-key   -n     M-)     switch-client -n -O creation
bind-key   -n     M-M     select-pane -M
bind-key   -n     M-[     select-pane -t :.-
bind-key   -n     M-\{    previous-window
bind-key   -n     M-\}    next-window
bind-key   -n     M-]     select-pane -t :.+
bind-key   -n     M-h     select-pane -L
bind-key   -n     M-j     select-pane -D
bind-key   -n     M-k     select-pane -U
bind-key   -n     M-l     select-pane -R
bind-key   -n     M-m     select-pane -m
bind-key   -n   C-M-Down  select-pane -D
bind-key   -n   C-M-Left  select-pane -L
bind-key   -n   C-M-Right select-pane -R
bind-key   -n   C-M-Up    select-pane -U
bind-key   -n   C-M-[     swap-pane -d -t :.-
bind-key   -n   C-M-\{    swap-window -d -t :-1
bind-key   -n   C-M-\}    swap-window -d -t :+1
bind-key   -n   C-M-]     swap-pane -d -t :.+
bind-key   -n   C-M-h     swap-pane -d -t '{left-of}'
bind-key   -n   C-M-j     swap-pane -d -t '{down-of}'
bind-key   -n   C-M-k     swap-pane -d -t '{up-of}'
bind-key   -n   C-M-l     swap-pane -d -t '{right-of}'
