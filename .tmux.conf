set-environment -gu GIT_DIR
set-environment -gu GIT_EXEC_PATH
set-environment -gu GIT_WORK_TREE

set-option -g focus-events on
set-option -g mode-keys vi
set-option -g pane-active-border-style "bg=#{?pane_modal_flag,blue,#{?pane_marked,magenta,#{?synchronize-panes,red,#{?pane_in_mode,yellow,brightred}}}},hidden"
set-option -g pane-status-current-style fg=brightred
set-option -g session-status-current-style fg=brightred
set-option -g status-keys vi
set-option -g window-status-current-style fg=brightred

if-shell '[[ "$(mode)" == dark ]]' \
  'set-option -g message-command-style "bg=black,fg=green,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=black}"' \
  'set-option -g message-command-style "bg=brightwhite,fg=green,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=brightwhite}"'

if-shell '[[ "$(mode)" == dark ]]' \
  'set-option -g message-style "bg=yellow,fg=black,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=yellow}"' \
  'set-option -g message-style "bg=yellow,fg=brightwhite,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=yellow}"'

if-shell '[[ "$(mode)" == dark ]]' \
  'set-option -g status-style fg=terminal,bg=black' \
  'set-option -g status-style fg=terminal,bg=brightwhite'

bind-key        (     switch-client -p -O creation
bind-key        )     switch-client -n -O creation
bind-key        _     split-window -d
bind-key        |     split-window -d -h
bind-key -n   M-(     switch-client -p -O creation
bind-key -n   M-)     switch-client -n -O creation
bind-key -n   M-[     select-pane -t :.-
bind-key -n   M-\{    previous-window
bind-key -n   M-\}    next-window
bind-key -n   M-]     select-pane -t :.+
bind-key -n C-M-Down  select-pane -D
bind-key -n C-M-Left  select-pane -L
bind-key -n C-M-Right select-pane -R
bind-key -n C-M-Up    select-pane -U
bind-key -n M-S-Left  swap-window -d -t :-1
bind-key -n M-S-Right swap-window -d -t :+1
