set-option      -g    @show-status-style                1
set-option      -g    @status-color                     "#{?#{&&:#{m:*!*,#{E:@state}},#{E:@status-color-attn}},#{E:@status-color-attn},#{&&:#{m:*…*,#{E:@state}},#{E:@status-color-busy}},#{E:@status-color-busy},#{&&:#{m:*✓*,#{E:@state}},#{E:@status-color-done}},#{E:@status-color-done}}"
