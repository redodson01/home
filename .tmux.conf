#########################################

# Custom Options
set-option      -g    focus-events                      on
set-option      -g    mode-keys                         vi
set-option      -g    status                            2
set-option      -g    status-keys                       vi

# Custom Options - Formats
set-option      -g    @session-state                    "#{?#{m:*!*,#{W:#{E:@window-state}}},!}#{?#{m:*…*,#{W:#{E:@window-state}}},…}#{?#{m:*✓*,#{W:#{E:@window-state}}},✓}"
