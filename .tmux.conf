# The server copies the environment of whatever process starts it, so keep only
# login-session variables, and give jobs a PATH with ~/.local/bin and Homebrew.
set-environment -g PATH ~/.local/bin:/opt/homebrew/bin:/opt/homebrew/sbin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
run-shell 'awk "BEGIN { for (name in ENVIRON) print name }" | grep -vxE "HOME|LANG|LOGNAME|PATH|SHELL|SSH_AUTH_SOCK|TMPDIR|USER" | sed "s/^/set-environment -gu /" | tmux source-file -'

set-option -g default-terminal xterm-256color
