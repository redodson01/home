set-option      -g    pane-active-border-style          "bg=#{E:@pane-color-fg},fg=#{E:@pane-color-fg}"
set-option      -g    pane-border-style                 default
set-option      -g    pane-status-current-style         "#{E:@current-color},#{E:@pane-color},#{E:@status-current-style},#{?@show-status-style,#{E:@pane-style}}"
