#################################################################################
# Key Bindings                                                                  #
#################################################################################

#########################################
# Default Key Bindings                  #
#########################################

# Default Key Bindings
bind-key        -T    prefix        (                   switch-client -p
bind-key        -T    prefix        )                   switch-client -n
unbind-key      -T    prefix        _
unbind-key      -T    prefix        |
unbind-key      -T    root        M-(
unbind-key      -T    root        M-)
unbind-key      -T    root        M-[
unbind-key      -T    root        M-]
unbind-key      -T    root       "M-{"
unbind-key      -T    root       "M-}"
unbind-key      -T    root      C-M-[
unbind-key      -T    root      C-M-]
unbind-key      -T    root     "C-M-{"
unbind-key      -T    root     "C-M-}"

# Default Key Bindings - Movement
unbind-key      -T    root        M-h
unbind-key      -T    root        M-j
unbind-key      -T    root        M-k
unbind-key      -T    root        M-l
unbind-key      -T    root      C-M-h
unbind-key      -T    root      C-M-j
unbind-key      -T    root      C-M-k
unbind-key      -T    root      C-M-l
unbind-key      -T    root    C-M-S-h
unbind-key      -T    root    C-M-S-j
unbind-key      -T    root    C-M-S-k
unbind-key      -T    root    C-M-S-l

#########################################
# Custom Key Bindings                   #
#########################################

# Custom Key Bindings
bind-key        -T    prefix        (                   switch-client -p -O creation
bind-key        -T    prefix        )                   switch-client -n -O creation
bind-key        -T    prefix        _                   split-window -d
bind-key        -T    prefix        |                   split-window -d -h
bind-key        -T    root        M-(                   switch-client -p -O creation
bind-key        -T    root        M-)                   switch-client -n -O creation
bind-key        -T    root        M-[                   select-pane -t :.-
bind-key        -T    root        M-]                   select-pane -t :.+
bind-key        -T    root       "M-{"                  previous-window
bind-key        -T    root       "M-}"                  next-window
bind-key        -T    root      C-M-[                   swap-pane -d -t :.-
bind-key        -T    root      C-M-]                   swap-pane -d -t :.+
bind-key        -T    root     "C-M-{"                  swap-window -d -t :-1
bind-key        -T    root     "C-M-}"                  swap-window -d -t :+1

# Custom Key Bindings - Movement
bind-key        -T    root        M-h                   select-pane -L
bind-key        -T    root        M-j                   select-pane -D
bind-key        -T    root        M-k                   select-pane -U
bind-key        -T    root        M-l                   select-pane -R
bind-key        -T    root      C-M-h                   if-shell -F "#{pane_marked_set}" 'move-pane -b -d    -h' 'swap-pane    -d       -t "{left-of}"'
bind-key        -T    root      C-M-j                   if-shell -F "#{pane_marked_set}" 'move-pane    -d      ' 'swap-pane    -d       -t "{down-of}"'
bind-key        -T    root      C-M-k                   if-shell -F "#{pane_marked_set}" 'move-pane -b -d      ' 'swap-pane    -d       -t "{up-of}"'
bind-key        -T    root      C-M-l                   if-shell -F "#{pane_marked_set}" 'move-pane    -d    -h' 'swap-pane    -d       -t "{right-of}"'
bind-key        -T    root    C-M-S-h                   if-shell -F "#{pane_marked_set}" 'move-pane -b -d -f -h -t "{top-left}"'
bind-key        -T    root    C-M-S-j                   if-shell -F "#{pane_marked_set}" 'move-pane    -d -f    -t "{bottom-right}"'
bind-key        -T    root    C-M-S-k                   if-shell -F "#{pane_marked_set}" 'move-pane -b -d -f    -t "{top-left}"'
bind-key        -T    root    C-M-S-l                   if-shell -F "#{pane_marked_set}" 'move-pane    -d -f -h -t "{bottom-right}"'
