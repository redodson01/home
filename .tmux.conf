set-option      -g    @status-color-done                fg=green
set-option      -g    @status-current-style             underscore
set-option      -g    @status-style                     "#{?#{&&:#{m:*!*,#{E:@state}},#{E:@status-style-attn}},#{E:@status-style-attn},#{&&:#{m:*…*,#{E:@state}},#{E:@status-style-busy}},#{E:@status-style-busy},#{&&:#{m:*✓*,#{E:@state}},#{E:@status-style-done}},#{E:@status-style-done}}"
set-option      -g    @status-style-attn                reverse
set-option      -g    @status-style-bg                  "#{?#{==:#(mode),light},brightwhite,black}"
