# Default Options
set-option -g focus-events                      off
set-option -g mode-keys                         emacs
set-option -g status                            on
set-option -g status-keys                       emacs

# Default Options - Formats
set-option -g status-format[0]                  "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set-option -g status-format[1]                  "#[align=left]#{R: ,#{e|-:#{w;T;=/#{status-left-length}:status-left},3}}P: #[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{P:#[range=pane|#{pane_id} #{E:pane-status-style}]#[push-default]#{T:window-pane-status-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=pane|#{pane_id} list=focus #{?#{!=:#{E:pane-status-current-style},default},#{E:pane-status-current-style},#{E:pane-status-style}}]#[push-default]#{T:window-pane-current-status-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}"
set-option -g status-format[2]                  "#[align=left]#{R: ,#{e|-:#{w;T;=/#{status-left-length}:status-left},3}}S: #[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S:#[range=session|#{session_id} #{E:session-status-style}]#[push-default]#S#{q/h:session_alert}#[pop-default]#[norange list=on default]  ,#[range=session|#{session_id} list=focus #{?#{!=:#{E:session-status-current-style},default},#{E:session-status-current-style},#{E:session-status-style}}]#[push-default]#S*#{q/h:session_alert}#[pop-default]#[norange list=on default] }"
set-option -g status-format[3]                  ''
set-option -g window-pane-current-status-format "#P:[#T]#{?pane_flags,#{pane_flags}, }"
set-option -g window-pane-status-format         "#P:[#T]#{?pane_flags,#{pane_flags}, }"
set-option -g window-status-current-format      "#I:#W#{?window_flags,#{window_flags}, }"
set-option -g window-status-format              "#I:#W#{?window_flags,#{window_flags}, }"

# Default Options - Styles
set-option -g message-command-style             "bg=themeblack,fg=themeyellow,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themeblack}"
set-option -g message-style                     "bg=themeyellow,fg=themeblack,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=themeyellow}"
set-option -g pane-active-border-style          "fg=#{?pane_modal_flag,themeblue,#{?pane_marked,thememagenta,#{?synchronize-panes,themered,#{?pane_in_mode,themeyellow,themegreen}}}}"
set-option -g pane-border-style                 fg=themelightgrey
set-option -g pane-status-current-style         underscore
set-option -g pane-status-style                 default
set-option -g session-status-current-style      underscore
set-option -g session-status-style              default
set-option -g status-style                      bg=themegreen,fg=themeblack
set-option -g window-status-current-style       underscore
set-option -g window-status-style               default

# Custom Options
set-option -g focus-events                      on
set-option -g mode-keys                         vi
set-option -g status                            4
set-option -g status-keys                       vi

# Custom Options - Formats
set-option -g @session-status-current-format    "#S*"
set-option -g @session-status-format            "#S"
set-option -g status-format[0]                  ''
set-option -g status-format[1]                  "#[align=left]#{R: ,#{e|-:#{w;T;=/#{status-left-length}:status-left},3}}S: #[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{S:#[range=session|#{session_id} #{E:session-status-style}]#[push-default]#{E:@session-status-format}#{q/h:session_alert}#[pop-default]#[norange list=on default]  ,#[range=session|#{session_id} list=focus #{?#{!=:#{E:session-status-current-style},default},#{E:session-status-current-style},#{E:session-status-style}}]#[push-default]#{E:@session-status-current-format}#{q/h:session_alert}#[pop-default]#[norange list=on default] }"
set-option -g status-format[2]                  "#[align=left range=left #{E:status-left-style}]#[push-default]#{T;=/#{status-left-length}:status-left}#[pop-default]#[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{W:#[range=window|#{window_index} #{E:window-status-style}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-format}#[pop-default]#[norange default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=window|#{window_index} list=focus #{?#{!=:#{E:window-status-current-style},default},#{E:window-status-current-style},#{E:window-status-style}}#{?#{&&:#{window_last_flag},#{!=:#{E:window-status-last-style},default}}, #{E:window-status-last-style},}#{?#{&&:#{window_bell_flag},#{!=:#{E:window-status-bell-style},default}}, #{E:window-status-bell-style},#{?#{&&:#{||:#{window_activity_flag},#{window_silence_flag}},#{!=:#{E:window-status-activity-style},default}}, #{E:window-status-activity-style},}}]#[push-default]#{T:window-status-current-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}#[nolist align=right range=right #{E:status-right-style}]#[push-default]#{T;=/#{status-right-length}:status-right}#[pop-default]#[norange default]"
set-option -g status-format[3]                  "#[align=left]#{R: ,#{e|-:#{w;T;=/#{status-left-length}:status-left},3}}P: #[norange default]#[list=on align=#{status-justify}]#[list=left-marker]<#[list=right-marker]>#[list=on]#{P/i:#[range=pane|#{pane_id} #{E:pane-status-style}]#[push-default]#{T:window-pane-status-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}},#[range=pane|#{pane_id} list=focus #{?#{!=:#{E:pane-status-current-style},default},#{E:pane-status-current-style},#{E:pane-status-style}}]#[push-default]#{T:window-pane-current-status-format}#[pop-default]#[norange list=on default]#{?loop_last_flag,,#{E:window-status-separator}}}"
set-option -g window-pane-current-status-format "#P:[#D]#{p1:#{pane_flags}}"
set-option -g window-pane-status-format         "#P:[#D]#{p1:#{pane_flags}}"
set-option -g window-status-current-format      "#I:#W#{p1:#{window_flags}}"
set-option -g window-status-format              "#I:#W#{p1:#{window_flags}}"

# Custom Options - Styles
set-option -g @current-style-fg                 brightred
set-option -g @pane-current-style-fg            "#{?pane_modal_flag,blue,pane_marked,magenta,synchronize-panes,red,pane_in_mode,yellow,#{E:@current-style-fg}}"
set-option -g @status-current-style             underscore
set-option -g @style-bg                         "#{?#{==:#(mode),light},brightwhite,black}"
set-option -g message-command-style             "bg=#{E:@style-bg},fg=yellow,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{E:@style-bg}}"
set-option -g message-style                     "bg=yellow,fg=#{E:@style-bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=yellow}"
set-option -g pane-active-border-style          "bg=#{E:@pane-current-style-fg},fg=#{E:@pane-current-style-fg}"
set-option -g pane-border-style                 default
set-option -g pane-status-current-style         "fg=#{E:@pane-current-style-fg},#{E:@status-current-style}#{?pane_marked,#,reverse}"
set-option -g pane-status-style                 "#{?pane_marked,reverse,default}"
set-option -g session-status-current-style      "fg=#{E:@current-style-fg},#{E:@status-current-style}"
set-option -g session-status-style              default
set-option -g status-style                      "bg=#{E:@style-bg}"
set-option -g window-status-current-style       "fg=#{E:@current-style-fg},#{E:@status-current-style}"
set-option -g window-status-style               default

# Default Key Bindings
bind-key   -T prefix     (                      switch-client -p
bind-key   -T prefix     )                      switch-client -n
unbind-key -T prefix     _
unbind-key -T prefix     |
unbind-key -T root     M-(
unbind-key -T root     M-)
unbind-key -T root     M-[
unbind-key -T root     M-]
unbind-key -T root    "M-{"
unbind-key -T root    "M-}"

# Custom Key Bindings
bind-key   -T prefix     (                      switch-client -p -O creation
bind-key   -T prefix     )                      switch-client -n -O creation
bind-key   -T prefix     _                      split-window -d
bind-key   -T prefix     |                      split-window -d -h
bind-key   -T root     M-(                      switch-client -p -O creation
bind-key   -T root     M-)                      switch-client -n -O creation
bind-key   -T root     M-[                      select-pane -t :.-
bind-key   -T root     M-]                      select-pane -t :.+
bind-key   -T root    "M-{"                     previous-window
bind-key   -T root    "M-}"                     next-window
