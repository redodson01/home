set-option -g @bg "#{?#{==:#(mode),dark},black,brightwhite}"
set-option -g focus-events on
set-option -g message-command-style "bg=#{E:@bg},fg=green,#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=#{E:@bg}}"
set-option -g message-style "bg=yellow,fg=#{E:@bg},#{?#{m/r:(^|#,)IS(PANE|MODE)($|#,),#{prompt_flags}},,fill=yellow}"
set-option -g mode-keys vi
set-option -g pane-active-border-style "bg=#{?pane_modal_flag,blue,#{?pane_marked,magenta,#{?synchronize-panes,red,#{?pane_in_mode,yellow,brightred}}}},hidden"
set-option -g pane-status-current-style fg=brightred
set-option -g session-status-current-style fg=brightred
set-option -g status-keys vi
set-option -g status-style "fg=terminal,bg=#{E:@bg}"
set-option -g window-status-current-style fg=brightred
