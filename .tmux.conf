if-shell '[[ "$(mode)" == dark ]]' \
  'set-option -g message-style bg=black,fill=black' \
  'set-option -g message-style bg=white,fill=white'

if-shell '[[ "$(mode)" == dark ]]' \
  'set-option -g status-style bg=black,fill=black' \
  'set-option -g status-style bg=white,fill=white'

set-option -g default-terminal xterm-256color
set-option -g focus-events on
set-option -g mode-keys vi
set-option -g mouse on
set-option -g pane-active-border-style hidden,bg=brightred
set-option -g status-keys emacs
set-option -g status-right '%a %b %d %I:%M %p'
set-option -g window-status-current-format '#I:#W#{?@window_state,#{@window_state},#F,#F, }'
set-option -g window-status-current-style fg=brightred
set-option -g window-status-format '#I:#W#{?@window_state,#{@window_state},#F,#F, }'

bind-key          (     switch-client -p -O creation
bind-key          )     switch-client -n -O creation
bind-key          R     move-window -r
bind-key          _     split-window -d
bind-key          |     split-window -d -h
bind-key -n       ·     switch-client -p -O creation        # Option-(
bind-key -n       ‘     select-pane -t :.+                  # Option-]
bind-key -n       ’     next-window                         # Option-}
bind-key -n       ‚     switch-client -n -O creation        # Option-)
bind-key -n       “     select-pane -t :.-                  # Option-[
bind-key -n       ”     previous-window                     # Option-{
bind-key -n   C-M-Down  select-pane -D
bind-key -n   C-M-Left  select-pane -L
bind-key -n   C-M-Right select-pane -R
bind-key -n   C-M-Up    select-pane -U
bind-key -n   M-S-Left  swap-window -d -t :-1
bind-key -n   M-S-Right swap-window -d -t :+1
bind-key -n C-M-S-Down  run-shell -E 'tmux-move-pane down'
bind-key -n C-M-S-Left  run-shell -E 'tmux-move-pane left'
bind-key -n C-M-S-Right run-shell -E 'tmux-move-pane right'
bind-key -n C-M-S-Up    run-shell -E 'tmux-move-pane up'
