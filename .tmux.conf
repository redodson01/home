set-option      -g    window-status-format              "#I:#W#{p1:#{window_flags}#{E:@window-state}}"

# Custom Options - Styles
set-option      -g    @current-color                    "fg=#{E:@current-color-fg}"
set-option      -g    @current-color-fg                 brightred
set-option      -g    @message-command-style-fg         "#{E:@message-style-fg}"
set-option      -g    @message-style-fg                 yellow
set-option      -g    @pane-color                       "#{?pane_modal_flag,fg=blue,pane_marked,fg=magenta,synchronize-panes,fg=red,pane_in_mode,fg=yellow}"
